<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Chat Lab 网页版 - 登录</title>
    <!-- 引用外部 CSS -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>

        <h2>欢迎来到 Chat Lab</h2>

    <script src="/app.js"></script>

</html>
